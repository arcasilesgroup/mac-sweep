name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install ruff mypy
          brew install shellcheck

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Mypy strict
        run: mypy --strict src/mac_sweep/

      - name: Shellcheck
        run: shellcheck scripts/sweep scripts/collect-data.sh

  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: python3 -m pytest tests/ -v --cov --cov-fail-under=85

  security:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: No print in core
        run: |
          if grep -rn --include='*.py' 'print(' src/mac_sweep/core/ | grep -v '^\s*#' | grep -v '"""' | grep -v "'''"; then
            echo "ERROR: print() found in core/ — core modules must not print"
            exit 1
          fi

      - name: No sys.exit in core
        run: |
          if grep -rn --include='*.py' 'sys\.exit(' src/mac_sweep/core/; then
            echo "ERROR: sys.exit() call found in core/ — core modules must not exit"
            exit 1
          fi

      - name: No shell=True
        run: |
          if grep -rn --include='*.py' 'shell=True' src/ | grep -v '^\s*#' | grep -v '"""' | grep -v "'''"; then
            echo "ERROR: shell=True found — this is a security risk"
            exit 1
          fi

      - name: No sudo
        run: |
          if grep -rn --include='*.py' --include='*.sh' 'sudo' src/ scripts/; then
            echo "ERROR: sudo found — mac-sweep never uses elevated privileges"
            exit 1
          fi
