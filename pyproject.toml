[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mac-sweep"
version = "2.0.0"
description = "macOS application audit and cleanup toolkit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

[project.scripts]
mac-sweep = "mac_sweep.cli.app:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "mypy>=1.5", "ruff>=0.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/mac_sweep"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/mac_sweep"]
branch = true

[tool.coverage.report]
fail_under = 85
